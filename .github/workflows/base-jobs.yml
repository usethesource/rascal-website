name: Base Website builder

on:
    workflow_call:

env:
  MAVEN_OPTS: "-Xmx4G -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"

jobs:
    prepare-sources:
      name: Prepare the website sources
      runs-on: ubicloud-standard-2
      steps:
        - name: Clone
          uses: actions/checkout@v4
  
        - uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '17'
            cache: 'maven'
  
        - uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: yarn
  
        - uses: browser-actions/setup-chrome@latest
          with:
            chrome-version: 'stable'
          id: setup-chrome

        - run: which chrome

        - uses: nanasess/setup-chromedriver@v2
          with:
            chromedriver-version: ${{ steps.setup-chrome.outputs.chrome-version }}

        - run: which chromedriver 
  
        # Copy docs from dependent projects, run tutor on local courses folder and copy results into docs and static/assets
        - name: Run rascal-tutor and reuse libraries
          run: MAVEN_OPTIONS="-Xss256m -Xmx3G -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn" mvn -B clean package -Dwebdriver.chrome.driver=/usr/local/bin/chromedriver -Dwebdriver.chrome.browser=`which chrome` 

        - uses: actions/upload-artifact@v4
          with:
            name: sources
            path: |
              .
              !target
              !.git
              !.github
              !.vscode
              !META-INF
